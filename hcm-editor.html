<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HCM Matrix Editor</title>
<style>
  :root {
    --peo: #E05206; --aso: #2563eb; --hcm: #7c3aed;
    --ink: #1a1a1a; --muted: #5a5a5b; --border: #e0d5cc;
    --surface: #faf8f6; --white: #ffffff; --charcoal: #3B3B3C;
    --radius: 8px; --danger: #dc2626;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--surface); color: var(--ink); min-height: 100vh; }

  .header { background: var(--charcoal); color: #fff; padding: 22px 32px 18px; }
  .header h1 { font-size: 1.2rem; font-weight: 700; }
  .header p  { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }
  .header a  { color: #fff; opacity: 0.7; font-size: 0.8rem; text-decoration: none; border: 1px solid rgba(255,255,255,0.3); padding: 4px 10px; border-radius: 4px; display: inline-block; margin-top: 12px; }
  .header a:hover { opacity: 1; }

  .main { max-width: 960px; margin: 0 auto; padding: 28px 20px 80px; }

  .status-bar { display: none; padding: 12px 16px; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; margin-bottom: 20px; }
  .status-bar.success { display: block; background: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
  .status-bar.error   { display: block; background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
  .status-bar.loading { display: block; background: #eff6ff; color: #1e40af; border: 1px solid #93c5fd; }

  .legend { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 600; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-dot.peo { background: var(--peo); }
  .legend-dot.aso { background: var(--aso); }
  .legend-dot.hcm { background: var(--hcm); }

  /* Question block */
  .q-block { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 20px; overflow: hidden; }

  .q-head { background: #f1f5f9; padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; gap: 10px; }
  .q-num-badge { background: var(--charcoal); color: #fff; font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; margin-top: 3px; white-space: nowrap; }

  .q-label-wrap { flex: 1; }
  .q-label-note { font-size: 0.7rem; color: var(--muted); margin-bottom: 5px; font-style: italic; }
  .q-label-input {
    width: 100%; font-size: 0.92rem; font-weight: 600; font-family: inherit;
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 5px;
    color: var(--ink); transition: border-color 0.15s;
  }
  .q-label-input:focus { outline: none; border-color: #94a3b8; }

  .section-chip { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: #e2e8f0; color: #475569; flex-shrink: 0; margin-top: 4px; }

  /* Answer rows */
  .answers-wrap { padding: 0; }
  .answer-row {
    display: grid;
    grid-template-columns: 1fr 60px 60px 60px 36px;
    gap: 8px;
    align-items: center;
    padding: 9px 14px;
    border-bottom: 1px solid #f0eae4;
  }
  .answer-row:last-of-type { border-bottom: none; }
  .answer-row:hover { background: #fdf9f7; }

  .answer-header {
    display: grid;
    grid-template-columns: 1fr 60px 60px 60px 36px;
    gap: 8px;
    padding: 6px 14px;
    background: #fdf9f7;
    border-bottom: 1px solid var(--border);
  }
  .answer-header span { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); text-align: center; }
  .answer-header span:first-child { text-align: left; }

  .th-peo { color: var(--peo) !important; }
  .th-aso { color: var(--aso) !important; }
  .th-hcm { color: var(--hcm) !important; }

  .a-text-input {
    width: 100%; font-size: 0.85rem; font-family: inherit;
    padding: 5px 8px; border: 1px solid var(--border);
    border-radius: 5px; color: var(--ink); transition: border-color 0.15s;
  }
  .a-text-input:focus { outline: none; border-color: #94a3b8; }

  .w-input {
    width: 100%; padding: 5px 4px; border: 1px solid var(--border);
    border-radius: 5px; font-size: 0.875rem; text-align: center;
    transition: border-color 0.15s;
  }
  .w-input:focus { outline: none; }
  .w-input.peo:focus { border-color: var(--peo); }
  .w-input.aso:focus { border-color: var(--aso); }
  .w-input.hcm:focus { border-color: var(--hcm); }

  .del-answer-btn {
    background: none; border: 1px solid #fca5a5; color: #ef4444;
    border-radius: 4px; width: 28px; height: 28px; cursor: pointer;
    font-size: 0.85rem; display: flex; align-items: center; justify-content: center;
    transition: background 0.12s;
  }
  .del-answer-btn:hover { background: #fee2e2; }

  .add-answer-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px dashed #94a3b8; color: var(--muted);
    border-radius: 5px; padding: 7px 14px; cursor: pointer;
    font-size: 0.82rem; font-family: inherit; font-weight: 600;
    margin: 8px 14px 10px; transition: border-color 0.15s, color 0.15s;
  }
  .add-answer-btn:hover { border-color: var(--charcoal); color: var(--charcoal); }

  /* Action bar */
  .action-bar {
    display: flex; gap: 12px; align-items: center;
    background: var(--white); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px 20px;
    position: sticky; bottom: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    margin-top: 8px;
  }
  .btn-update {
    background: #16a34a; color: #fff; border: none; padding: 11px 28px;
    border-radius: var(--radius); font-size: 0.95rem; font-weight: 700;
    cursor: pointer; transition: background 0.15s; font-family: inherit;
  }
  .btn-update:hover { background: #15803d; }
  .btn-update:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn-reset {
    background: #fff; color: var(--muted); border: 1px solid var(--border);
    padding: 11px 20px; border-radius: var(--radius); font-size: 0.875rem;
    font-weight: 600; cursor: pointer; font-family: inherit; transition: border-color 0.15s;
  }
  .btn-reset:hover { border-color: #94a3b8; color: var(--ink); }
  .hint { font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>

<div class="header">
  <h1>⚙️ HCM Matrix Editor</h1>
  <p>Edit question text, answer options, and point weights — then click Update to apply changes live.</p>
  <a href="/matrix">← Back to Decision Matrix</a>
</div>

<div class="main">
  <div class="status-bar loading" id="status">Loading current questions…</div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot peo"></div>PEO points</div>
    <div class="legend-item"><div class="legend-dot aso"></div>ASO points</div>
    <div class="legend-item"><div class="legend-dot hcm"></div>HCM points</div>
  </div>

  <div id="editor-body"></div>

  <div class="action-bar">
    <button class="btn-update" id="btn-update" onclick="pushUpdate()" disabled>🔄 Update Decision Matrix</button>
    <button class="btn-reset" onclick="reloadData()">↺ Reload</button>
    <span class="hint">Changes apply instantly to the live matrix — no deploy needed.</span>
  </div>
</div>

<script>
let questions = [];

async function reloadData() {
  setStatus('loading', 'Loading…');
  document.getElementById('btn-update').disabled = true;
  try {
    const res = await fetch('/api/matrix-data');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    questions = await res.json();
    renderEditor();
    setStatus('success', '✓ Loaded. Make your edits, then click Update Decision Matrix.');
    document.getElementById('btn-update').disabled = false;
  } catch(e) {
    setStatus('error', '✗ Failed to load: ' + e.message);
  }
}

function renderEditor() {
  const body = document.getElementById('editor-body');
  body.innerHTML = '';
  questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'q-block';
    block.dataset.qi = qi;

    // Header: question number + section chip + editable label
    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `
      <span class="q-num-badge">Q${qi + 1}</span>
      <div class="q-label-wrap">
        <div class="q-label-note">Question text (shown to sellers)</div>
        <input type="text" class="q-label-input" value="${escHtml(q.label)}" data-qi="${qi}" placeholder="Question text…">
      </div>
      <span class="section-chip">${escHtml(q.section)}</span>`;
    block.appendChild(head);

    // Column headers
    const hdr = document.createElement('div');
    hdr.className = 'answer-header';
    hdr.innerHTML = `
      <span>Answer Option Text</span>
      <span class="th-peo">PEO</span>
      <span class="th-aso">ASO</span>
      <span class="th-hcm">HCM</span>
      <span></span>`;
    block.appendChild(hdr);

    // Answer rows
    const answersWrap = document.createElement('div');
    answersWrap.className = 'answers-wrap';
    answersWrap.dataset.qi = qi;
    q.answers.forEach((a, ai) => {
      answersWrap.appendChild(buildAnswerRow(qi, ai, a));
    });
    block.appendChild(answersWrap);

    // Add answer button
    const addBtn = document.createElement('button');
    addBtn.className = 'add-answer-btn';
    addBtn.innerHTML = '+ Add Answer Option';
    addBtn.onclick = () => addAnswer(qi);
    block.appendChild(addBtn);

    body.appendChild(block);
  });
}

function buildAnswerRow(qi, ai, a) {
  const row = document.createElement('div');
  row.className = 'answer-row';
  row.dataset.qi = qi;
  row.dataset.ai = ai;
  row.innerHTML = `
    <input type="text" class="a-text-input" value="${escHtml(a.text)}" placeholder="Answer text…" data-qi="${qi}" data-ai="${ai}" data-field="text">
    <input type="number" class="w-input peo" min="0" max="9" value="${a.pts[0]}" data-qi="${qi}" data-ai="${ai}" data-i="0">
    <input type="number" class="w-input aso" min="0" max="9" value="${a.pts[1]}" data-qi="${qi}" data-ai="${ai}" data-i="1">
    <input type="number" class="w-input hcm" min="0" max="9" value="${a.pts[2]}" data-qi="${qi}" data-ai="${ai}" data-i="2">
    <button class="del-answer-btn" onclick="removeAnswer(${qi},${ai})" title="Remove this answer">✕</button>`;
  return row;
}

function addAnswer(qi) {
  questions[qi].answers.push({ key: 'new-' + Date.now(), text: '', pts: [0, 0, 0] });
  rerenderAnswers(qi);
}

function removeAnswer(qi, ai) {
  if (questions[qi].answers.length <= 1) {
    alert('A question must have at least one answer option.');
    return;
  }
  questions[qi].answers.splice(ai, 1);
  rerenderAnswers(qi);
}

function rerenderAnswers(qi) {
  // Collect current state of all other questions first
  collectState();
  // Re-render just the answers section for this question
  const blocks = document.querySelectorAll('.q-block');
  const block = blocks[qi];
  const oldWrap = block.querySelector('.answers-wrap');
  const newWrap = document.createElement('div');
  newWrap.className = 'answers-wrap';
  newWrap.dataset.qi = qi;
  questions[qi].answers.forEach((a, ai) => {
    newWrap.appendChild(buildAnswerRow(qi, ai, a));
  });
  block.replaceChild(newWrap, oldWrap);
}

function collectState() {
  // Collect question labels
  document.querySelectorAll('.q-label-input').forEach(inp => {
    const qi = parseInt(inp.dataset.qi);
    if (questions[qi]) questions[qi].label = inp.value;
  });
  // Collect answer texts and weights
  document.querySelectorAll('.answer-row').forEach(row => {
    const qi = parseInt(row.dataset.qi);
    const ai = parseInt(row.dataset.ai);
    if (!questions[qi] || !questions[qi].answers[ai]) return;
    const textInp = row.querySelector('.a-text-input');
    if (textInp) questions[qi].answers[ai].text = textInp.value;
    row.querySelectorAll('.w-input').forEach(inp => {
      const i = parseInt(inp.dataset.i);
      questions[qi].answers[ai].pts[i] = parseInt(inp.value) || 0;
    });
  });
}

async function pushUpdate() {
  collectState();
  const btn = document.getElementById('btn-update');
  btn.disabled = true;
  btn.textContent = '⏳ Updating…';
  setStatus('loading', 'Applying changes to the live Decision Matrix…');
  try {
    const res = await fetch('/api/matrix-update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ questions })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
    setStatus('success', '✅ Decision Matrix updated! Changes are live at /matrix.');
  } catch(e) {
    setStatus('error', '✗ Update failed: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 Update Decision Matrix';
  }
}

function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status-bar ' + type;
  el.textContent = msg;
}

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

reloadData();
</script>
</body>
</html>
